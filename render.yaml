services:
  - type: web
    name: strangerconnect-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: CLIENT_ORIGIN
        value: "*"
      - key: SENTRY_DSN
        sync: false
